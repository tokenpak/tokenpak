name: License check

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  license-policy:
    name: No superseded first-party license declarations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Compute changed files
        id: changed
        run: |
          set -euo pipefail
          event="${{ github.event_name }}"
          case "$event" in
            pull_request)
              base="${{ github.event.pull_request.base.sha }}"
              head="${{ github.event.pull_request.head.sha }}"
              ;;
            push)
              base="${{ github.event.before }}"
              head="${{ github.event.after }}"
              ;;
            *)
              echo "::error::Unsupported event: $event"
              exit 1
              ;;
          esac
          if [[ -z "$base" || "$base" =~ ^0+$ ]]; then
            echo "::error::Event has no usable base SHA; refusing an empty scan."
            exit 1
          fi
          if [[ -z "$head" || "$head" =~ ^0+$ ]]; then
            echo "::error::Event has no usable head SHA; refusing an empty scan."
            exit 1
          fi
          # A failed comparison must not become a successful empty scan.
          git diff --name-only --diff-filter=AM "$base" "$head" > all-changed-files.txt
          grep -vE "^(tests/|packages/tests/|sdk/tests/|sdk/dist/)" all-changed-files.txt \
            > changed-files.txt || [[ $? -eq 1 ]]
          echo "Changed files:"
          sed 's/^/  /' changed-files.txt

      - name: Scan changed files
        run: |
          if [ ! -s changed-files.txt ]; then
            echo "No relevant files changed; skipping."
            exit 0
          fi
          python3 scripts/release_gate/license_policy_scan.py \
            --ledger decisions/ledger/license.md \
            --paths-from changed-files.txt \
            --root . \
            --annotation error
