# release-rehearsal.yml — weekly dry-run of the full release pipeline.
#
# Std 30 §8 (R8) + §13.4 (R19). Triggered on Mondays 09:00 UTC by the
# weekly repository integrity audit cycle (or manually via workflow_dispatch).
# Runs every gate
# in the production release pipeline EXCEPT PyPI publish.
#
# Hard guard: the publish step contains `if: github.ref != 'refs/tags/rehearsal-*'`
# so a misfire never publishes. The throwaway tag MUST start with `rehearsal-`.
#
# Authority: Std 30 §8, ratified 2026-05-09.

name: Release Rehearsal

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Throwaway tag (must start with rehearsal-)'
        required: true
        default: 'rehearsal-AUTO'
  schedule:
    # Mondays 09:13 UTC (off-clock minute per scheduler best-practice)
    - cron: '13 9 * * 1'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  preflight:
    name: Preflight — guard tag prefix
    runs-on: ubuntu-latest
    outputs:
      rehearsal_tag: ${{ steps.tag.outputs.tag }}
    steps:
      - name: Compute rehearsal tag
        id: tag
        run: |
          if [[ "${{ github.event_name }}" == "schedule" ]]; then
            TAG="rehearsal-$(date -u +%Y-%m-%d-%H%M)"
          else
            TAG="${{ github.event.inputs.tag }}"
            if [[ "$TAG" == "rehearsal-AUTO" ]]; then
              TAG="rehearsal-$(date -u +%Y-%m-%d-%H%M)"
            fi
          fi
          if [[ ! "$TAG" =~ ^rehearsal- ]]; then
            echo "::error::Tag $TAG does not start with 'rehearsal-' — refusing"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Rehearsal tag: $TAG"

  derive-install-shapes:
    name: Derive canonical install-shape matrix
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.derive.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python 3.11 TOML bootstrap
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Derive canonical A8 matrix
        id: derive
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          import pathlib
          import tomllib

          def digest(value):
              return hashlib.sha256(
                  json.dumps(value, separators=(",", ":"), ensure_ascii=True).encode()
              ).hexdigest()

          document = tomllib.loads(pathlib.Path("pyproject.toml").read_text())
          optional = document.get("project", {}).get("optional-dependencies")
          config = document.get("tool", {}).get("tokenpak", {}).get("install-shape-matrix")
          if not isinstance(optional, dict) or not isinstance(config, dict):
              raise SystemExit("canonical install-shape TOML tables are required")
          if set(config) != {"schema", "python_versions", "test_runner_requirements", "slim", "dev", "full"}:
              raise SystemExit("install-shape matrix has missing or unknown fields")
          if type(config["schema"]) is not int or config["schema"] != 1:
              raise SystemExit("unsupported install-shape schema")
          expected = {
              "python_versions": "4e1a3d878a6cb9904060256e15abcfea94496854b9bddd24f0a99c9e4e4531b4",
              "test_runner_requirements": "4faca0f0221183f1e151fe4c45cce2eec253f4e54202181eb8f5a1cbdd3fdb76",
              "leaf_groups": "2511115e1da68f6b6214b2fc6c1c01313af579d9e32157dc9a41d9227c7665b2",
              "all": "7e9a555ca1a056faa858e021efa3d8aa1bb05e939935d3faaeb7c8d019d9fa07",
              "full": "37e65d93627f128bebbf77beee73bd6fa2aee817d31e46355ddbb392be9f197a",
          }
          for key in ("python_versions", "test_runner_requirements"):
              if digest(config[key]) != expected[key]:
                  raise SystemExit(f"unexpected install-shape {key}")
          leaf_groups = [name for name in optional if name not in {"dev", "all", "full"}]
          if digest(leaf_groups) != expected["leaf_groups"]:
              raise SystemExit("optional dependency groups require explicit matrix ratification")
          for key in ("all", "full"):
              if digest(optional.get(key)) != expected[key]:
                  raise SystemExit(f"unexpected {key} meta-extra")
          expected_shapes = {
              "slim": ("4f53cda18c2baa0c0354bb5f9a3ecbe5ed12ab4d8e11ba873c2f11161202b945", "809359a41de82446cca6b27e5d80ccd24abd9e20a98c59347f1d8bf217819491"),
              "dev": ("891440a764c3873e713182495eab033f69c7becd942e2f79d9294b9f373a6a4c", "854fd124b184b8e68c4d7f409d3cad4f5e43ff56dc2d2ad2cbc590418c94d0b1"),
              "full": ("e79a3b8a148b06bddf5b5a70083e3a4c039fb21b69f6aa43abb5eb91d0274c2c", "938566330c29069717079aff364a48365b251425d8e83ee35dcb8a0f4ace0b36"),
          }
          rows = []
          for shape, (extras_hash, marker_hash) in expected_shapes.items():
              entry = config[shape]
              if not isinstance(entry, dict) or set(entry) != {"product_extras", "marker_selection"}:
                  raise SystemExit(f"invalid {shape} install-shape table")
              if digest(entry["product_extras"]) != extras_hash or digest(entry["marker_selection"]) != marker_hash:
                  raise SystemExit(f"unexpected {shape} install-shape values")
              for python_version in config["python_versions"]:
                  rows.append({
                      "shape": shape,
                      "python-version": python_version,
                      "product_extras": json.dumps(entry["product_extras"], separators=(",", ":")),
                      "test_runner_requirements": json.dumps(config["test_runner_requirements"] if shape == "slim" else [], separators=(",", ":")),
                      "marker_selection": entry["marker_selection"],
                  })
          if len(rows) != 12 or len({json.dumps(row, sort_keys=True) for row in rows}) != 12:
              raise SystemExit("install-shape matrix must contain twelve unique rows")
          with pathlib.Path(os.environ["GITHUB_OUTPUT"]).open("a") as output:
              output.write("matrix=" + json.dumps({"include": rows}, separators=(",", ":")) + "\n")
          PY

  install-shape-matrix:
    name: Install-shape matrix (slim/dev/full)
    needs: [preflight, derive-install-shapes]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.derive-install-shapes.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install (shape=${{ matrix.shape }})
        run: |
          python -m pip install --upgrade pip
          python - '${{ matrix.product_extras }}' '${{ matrix.test_runner_requirements }}' <<'PY'
          import json
          import subprocess
          import sys

          extras = json.loads(sys.argv[1])
          runner_requirements = json.loads(sys.argv[2])
          target = "." + ("[" + ",".join(extras) + "]" if extras else "")
          subprocess.check_call([sys.executable, "-m", "pip", "install", "-e", target])
          if runner_requirements:
              subprocess.check_call([sys.executable, "-m", "pip", "install", *runner_requirements])
          PY

      - name: Pytest with --continue-on-collection-errors (Std 30 §4 R4)
        id: pytest
        run: |
          MARKER_SELECTION='${{ matrix.marker_selection }}'
          # IMPORTANT: PIPESTATUS[0] captures pytest's exit code, not tee's
          # (tee always exits 0). $? after a pipe would swallow test failures.
          set +e
          python -m pytest tests/ \
            -m "$MARKER_SELECTION" \
            --continue-on-collection-errors \
            -q --tb=short \
            | tee pytest-output.log
          PYTEST_RC=${PIPESTATUS[0]}
          set -e
          # Count collection errors per Std 30 §4
          COLLECT_ERRORS=$(grep -c "^ERROR collecting" pytest-output.log || true)
          echo "collection_errors=$COLLECT_ERRORS" >> "$GITHUB_OUTPUT"
          echo "pytest_rc=$PYTEST_RC" >> "$GITHUB_OUTPUT"
          echo "Collection errors: $COLLECT_ERRORS  Pytest RC: $PYTEST_RC"

      - name: Gate on collection errors (Std 30 §4)
        if: steps.pytest.outputs.collection_errors != '0'
        run: |
          echo "::error::Collection errors detected (count=${{ steps.pytest.outputs.collection_errors }}). See Std 30 §4."
          exit 1

      - name: Gate on test failures
        if: steps.pytest.outputs.pytest_rc != '0' && steps.pytest.outputs.collection_errors == '0'
        run: |
          echo "::error::pytest exited ${{ steps.pytest.outputs.pytest_rc }} with no collection errors — runtime failures."
          exit 1

  release-gate-snapshots:
    name: Release-gate snapshot validation
    needs: preflight
    runs-on: ubuntu-latest
    env:
      # Skip first-run RBAC admin bootstrap during snapshot introspection so the
      # ephemeral admin password is never emitted into (public) CI logs.
      # See REIPO-SNAPGEN-LOG-HYGIENE-01.
      TOKENPAK_SNAPSHOT_GEN: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install (all extras for canonical snapshot reproduction)
        run: |
          python -m pip install --upgrade pip
          python - <<'PY'
          import subprocess
          import sys
          import tomllib

          extras = tomllib.load(open("pyproject.toml", "rb"))["tool"]["tokenpak"]["install-shape-matrix"]["full"]["product_extras"]
          target = "." + ("[" + ",".join(extras) + "]" if extras else "")
          subprocess.check_call([sys.executable, "-m", "pip", "install", target])
          PY
          # python-multipart is required by FastAPI Form/UploadFile imports in
          # vault/ingest/api and similar surfaces; without it the canonical
          # snapshot generation raises IMPORT_ERROR on those modules and the
          # api-snapshot-check fires phantom-removal noise. It is not yet an
          # advertised optional extra, so install it explicitly here.
          pip install python-multipart
      - name: api-snapshot-check (Std 30 §7 R7)
        run: make api-snapshot-check
      - name: workflow-steps-check (Std 30 §13.3 R11)
        run: make workflow-steps-check
      - name: telemetry-check (Std 30 §7 R7)
        run: make telemetry-check
      - name: taxonomy-check (Std 30 §5 R5)
        run: make taxonomy-check

  leak-scan:
    # Full-tree public-leak gate (rehearsal mirror of release.yml). Keeps the
    # weekly dry-run faithful to "every gate in the production release pipeline":
    # scans the built sdist + wheel for internal identity / workflow language
    # before artifacts are built.
    name: Public-leak scan (full shipped tree)
    needs: preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Build sdist + wheel for scanning
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: Scan shipped artifact for public-leak patterns
        run: python scripts/release_gate/check_release_leaks.py --dist dist/

  build-artifacts:
    name: Build sdist + wheel + sdist purity (R9)
    needs: [install-shape-matrix, release-gate-snapshots, leak-scan]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install build
        run: pip install --upgrade pip build
      - name: Build sdist + wheel
        run: python -m build
      - name: Sdist / wheel purity (Std 30 §13.1 R9)
        run: |
          # Inclusion-direction guard: shipped artifacts MUST NOT contain _internal/ paths.
          if unzip -l dist/*.whl | grep -E '_internal/|tests/_internal/'; then
            echo "::error::wheel contains _internal/ paths — Std 30 §13.1 violation"
            exit 1
          fi
          if tar -tzf dist/*.tar.gz | grep -E '_internal/|tests/_internal/'; then
            echo "::error::sdist contains _internal/ paths — Std 30 §13.1 violation"
            exit 1
          fi
          echo "✅  sdist + wheel purity: no _internal/ paths"
      - name: Upload artifacts (rehearsal — never published)
        uses: actions/upload-artifact@v7
        with:
          name: rehearsal-dist-${{ needs.preflight.outputs.rehearsal_tag }}
          path: dist/

  publish-blocked:
    # Hard guard per Std 30 §8: this step proves the publish branch would NOT
    # fire on a rehearsal tag. The actual condition (`if: github.ref !=
    # 'refs/tags/rehearsal-*'`) lives on the production release.yml publish
    # step; here we explicitly fail if anyone tries to publish a rehearsal tag.
    name: Publish guard (rehearsal MUST NOT publish)
    needs: build-artifacts
    runs-on: ubuntu-latest
    steps:
      - name: Refuse to publish rehearsal tag
        run: |
          echo "Rehearsal tag '${{ needs.preflight.outputs.rehearsal_tag }}' — publish step intentionally absent."
          echo "Per Std 30 §8: rehearsal workflow MUST NOT reach PyPI."
