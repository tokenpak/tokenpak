name: CI — Lint & Test

on:
  push:
    branches: [main, develop]
    paths:
      - 'tokenpak/**'
      - 'tests/**'
      - '.github/workflows/ci.yml'
      - '.github/workflows/release.yml'
      - '.github/workflows/release-rehearsal.yml'
      - 'pyproject.toml'
      - 'tokenpak/_snapshots/workflow-steps.json'
      - 'docs/cli-reference.md'
      - 'scripts/generate-cli-docs.py'
      - 'scripts/slim-install-smoke.sh'
  pull_request:
    branches: [main, develop]
    paths:
      - 'tokenpak/**'
      - 'tests/**'
      - '.github/workflows/ci.yml'
      - '.github/workflows/release.yml'
      - '.github/workflows/release-rehearsal.yml'
      - 'pyproject.toml'
      - 'tokenpak/_snapshots/workflow-steps.json'
      - 'docs/cli-reference.md'
      - 'scripts/generate-cli-docs.py'
      - 'scripts/slim-install-smoke.sh'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write

jobs:
  derive-install-shapes:
    name: Derive canonical install-shape matrix
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.derive.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python 3.11 TOML bootstrap
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Derive canonical A8 matrix
        id: derive
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          import pathlib
          import tomllib

          def digest(value):
              return hashlib.sha256(
                  json.dumps(value, separators=(",", ":"), ensure_ascii=True).encode()
              ).hexdigest()

          document = tomllib.loads(pathlib.Path("pyproject.toml").read_text())
          optional = document.get("project", {}).get("optional-dependencies")
          config = document.get("tool", {}).get("tokenpak", {}).get("install-shape-matrix")
          if not isinstance(optional, dict) or not isinstance(config, dict):
              raise SystemExit("canonical install-shape TOML tables are required")
          if set(config) != {"schema", "python_versions", "test_runner_requirements", "slim", "dev", "full"}:
              raise SystemExit("install-shape matrix has missing or unknown fields")
          if type(config["schema"]) is not int or config["schema"] != 1:
              raise SystemExit("unsupported install-shape schema")
          expected = {
              "python_versions": "4e1a3d878a6cb9904060256e15abcfea94496854b9bddd24f0a99c9e4e4531b4",
              "test_runner_requirements": "4faca0f0221183f1e151fe4c45cce2eec253f4e54202181eb8f5a1cbdd3fdb76",
              "leaf_groups": "2511115e1da68f6b6214b2fc6c1c01313af579d9e32157dc9a41d9227c7665b2",
              "all": "7e9a555ca1a056faa858e021efa3d8aa1bb05e939935d3faaeb7c8d019d9fa07",
              "full": "37e65d93627f128bebbf77beee73bd6fa2aee817d31e46355ddbb392be9f197a",
          }
          for key in ("python_versions", "test_runner_requirements"):
              if digest(config[key]) != expected[key]:
                  raise SystemExit(f"unexpected install-shape {key}")
          leaf_groups = [name for name in optional if name not in {"dev", "all", "full"}]
          if digest(leaf_groups) != expected["leaf_groups"]:
              raise SystemExit("optional dependency groups require explicit matrix ratification")
          for key in ("all", "full"):
              if digest(optional.get(key)) != expected[key]:
                  raise SystemExit(f"unexpected {key} meta-extra")
          expected_shapes = {
              "slim": ("4f53cda18c2baa0c0354bb5f9a3ecbe5ed12ab4d8e11ba873c2f11161202b945", "809359a41de82446cca6b27e5d80ccd24abd9e20a98c59347f1d8bf217819491"),
              "dev": ("891440a764c3873e713182495eab033f69c7becd942e2f79d9294b9f373a6a4c", "854fd124b184b8e68c4d7f409d3cad4f5e43ff56dc2d2ad2cbc590418c94d0b1"),
              "full": ("e79a3b8a148b06bddf5b5a70083e3a4c039fb21b69f6aa43abb5eb91d0274c2c", "938566330c29069717079aff364a48365b251425d8e83ee35dcb8a0f4ace0b36"),
          }
          rows = []
          for shape, (extras_hash, marker_hash) in expected_shapes.items():
              entry = config[shape]
              if not isinstance(entry, dict) or set(entry) != {"product_extras", "marker_selection"}:
                  raise SystemExit(f"invalid {shape} install-shape table")
              if digest(entry["product_extras"]) != extras_hash or digest(entry["marker_selection"]) != marker_hash:
                  raise SystemExit(f"unexpected {shape} install-shape values")
              for python_version in config["python_versions"]:
                  rows.append({
                      "shape": shape,
                      "python-version": python_version,
                      "product_extras": json.dumps(entry["product_extras"], separators=(",", ":")),
                      "test_runner_requirements": json.dumps(config["test_runner_requirements"] if shape == "slim" else [], separators=(",", ":")),
                      "marker_selection": entry["marker_selection"],
                  })
          if len(rows) != 12 or len({json.dumps(row, sort_keys=True) for row in rows}) != 12:
              raise SystemExit("install-shape matrix must contain twelve unique rows")
          with pathlib.Path(os.environ["GITHUB_OUTPUT"]).open("a") as output:
              output.write("matrix=" + json.dumps({"include": rows}, separators=(",", ":")) + "\n")
          PY

  install-shape-matrix:
    name: Install-shape matrix (shape=${{ matrix.shape }} py=${{ matrix.python-version }})
    needs: derive-install-shapes
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.derive-install-shapes.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install (shape=${{ matrix.shape }})
        run: |
          python -m pip install --upgrade pip
          python - '${{ matrix.product_extras }}' '${{ matrix.test_runner_requirements }}' <<'PY'
          import json
          import subprocess
          import sys

          extras = json.loads(sys.argv[1])
          runner_requirements = json.loads(sys.argv[2])
          target = "." + ("[" + ",".join(extras) + "]" if extras else "")
          subprocess.check_call([sys.executable, "-m", "pip", "install", "-e", target])
          if runner_requirements:
              subprocess.check_call([sys.executable, "-m", "pip", "install", *runner_requirements])
          PY

      - name: Run tests with collection-error visibility
        id: pytest
        run: |
          MARKER_SELECTION='${{ matrix.marker_selection }}'
          set +e
          python -m pytest tests/ \
            -m "$MARKER_SELECTION" \
            --continue-on-collection-errors \
            -q --tb=short \
            | tee pytest-output.log
          PYTEST_RC=${PIPESTATUS[0]}
          set -e
          COLLECT_ERRORS=$(grep -c "^ERROR collecting" pytest-output.log || true)
          echo "collection_errors=$COLLECT_ERRORS" >> "$GITHUB_OUTPUT"
          echo "pytest_rc=$PYTEST_RC" >> "$GITHUB_OUTPUT"

      - name: Gate on collection errors
        if: steps.pytest.outputs.collection_errors != '0'
        run: |
          echo "::error::Collection errors detected (count=${{ steps.pytest.outputs.collection_errors }})."
          exit 1

      - name: Gate on test failures
        if: steps.pytest.outputs.pytest_rc != '0' && steps.pytest.outputs.collection_errors == '0'
        run: |
          echo "::error::pytest exited ${{ steps.pytest.outputs.pytest_rc }} with no collection errors — runtime failures."
          exit 1

  cli-docs-check:
    name: CLI Docs Up-to-date
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install package (needed for the import chain pulled in by tokenpak.cli)
        # scripts/generate-cli-docs.py imports `tokenpak.cli`, which transitively
        # pulls in tokenpak.compression.recipes (yaml), tokenpak.telemetry
        # (requests), and other runtime deps. Mocking each external dep
        # one-at-a-time in the script is a whack-a-mole game; installing the
        # package once is more robust. [dev] is the smallest extras set that
        # covers the full runtime import chain.
        run: |
          python -m pip install --upgrade pip
          python - <<'PY'
          import subprocess
          import sys
          import tomllib

          extras = tomllib.load(open("pyproject.toml", "rb"))["tool"]["tokenpak"]["install-shape-matrix"]["dev"]["product_extras"]
          target = "." + ("[" + ",".join(extras) + "]" if extras else "")
          subprocess.check_call([sys.executable, "-m", "pip", "install", "-e", target])
          PY

      - name: Check CLI docs are current
        run: bash scripts/check-cli-docs.sh

  docs-audit:
    name: Doc Audit (soft warning)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Run doc audit script
        continue-on-error: true
        run: bash scripts/audit-docs.sh

  lint:
    name: Lint (Ruff)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "ruff==0.16.0"

      - name: Lint and format with pinned Ruff
        run: |
          ruff check tokenpak/ tests/ --select=E,F,W,I --ignore=E501,E701,E702,E402,E741,F841
          ruff format --check tokenpak/ tests/

  slim-install-smoke:
    name: Slim Install Smoke
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: 'pip'

      - name: Run slim install smoke
        run: bash scripts/slim-install-smoke.sh

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python - <<'PY'
          import subprocess
          import sys
          try:
              import tomllib
          except ModuleNotFoundError:
              import tomli as tomllib

          extras = tomllib.load(open("pyproject.toml", "rb"))["tool"]["tokenpak"]["install-shape-matrix"]["dev"]["product_extras"]
          target = "." + ("[" + ",".join(extras) + "]" if extras else "")
          subprocess.check_call([sys.executable, "-m", "pip", "install", "-e", target])
          PY

      - name: Run unit tests
        # needs_fast_host is excluded here on purpose: these are timing-sensitive
        # perf/SLA assertions (wall-clock latency/throughput) that flake on shared
        # GitHub runners, which are noisy and have no guaranteed capacity. They
        # remain signal-bearing and run in the dedicated "Performance Benchmarks"
        # workflow (benchmarks.yml: per-PR + nightly schedule) — just not in this
        # always-on correctness matrix, so a noisy-runner blip cannot red-flag
        # unrelated PRs. Marker convention: tests/conftest.py.
        run: |
          python -m pytest tests/ -v --tb=short \
            -m "not integration and not chaos and not slow and not needs_fast_host" \
            --junitxml=reports/test-results-py${{ matrix.python-version }}.xml \
            --cov=tokenpak \
            --cov-report=xml \
            --cov-report=term-missing

      - name: Run Phase 2 coverage tests (Tier-1 modules)
        if: matrix.python-version == '3.11'
        run: |
          python -m pytest tests/test_validation*.py tests/test_error*.py tests/test_cache*.py \
            -v --tb=short \
            --junitxml=reports/test-results-phase2-py${{ matrix.python-version }}.xml \
            --cov=tokenpak.core.validation \
            --cov=tokenpak.core.error_handling \
            --cov=tokenpak.cache \
            --cov-report=xml:coverage-tier1.xml \
            --cov-report=term-missing \
            -o addopts=""

      - name: Check Tier-1 coverage gate (minimum 50%)
        if: matrix.python-version == '3.11'
        run: |
          # Run pytest-cov on Tier-1 modules only, then enforce gate
          pytest tests/test_validation*.py tests/test_error*.py tests/test_cache*.py \
            --cov=tokenpak.core.validation \
            --cov=tokenpak.core.error_handling \
            --cov=tokenpak.cache \
            --cov-report=term-missing \
            -q --tb=no
          python -m coverage report \
            --include='*/tokenpak/core/validation*,*/tokenpak/core/error_handling*,*/tokenpak/cache*' \
            --fail-under=50 || {
            echo "::error::Tier-1 coverage below 50% — Phase 2 coverage gate FAILED"
            exit 1
          }

      - name: Check overall coverage (minimum 45%)
        if: matrix.python-version == '3.11'
        run: |
          python -m coverage report --fail-under=45 || {
            echo "::warning::Overall coverage below 45% baseline — monitoring (non-blocking)"
            exit 0
          }

      - name: Upload coverage (Tier-1)
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v6.0.2
        if: matrix.python-version == '3.11'
        with:
          files: ./coverage.xml,./coverage-tier1.xml
          fail_ci_if_error: false
          flags: phase2-coverage
          use_oidc: true

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-py${{ matrix.python-version }}
          path: reports/test-results-py${{ matrix.python-version }}.xml
          retention-days: 30

      - name: Upload Phase 2 test results
        if: always() && matrix.python-version == '3.11'
        uses: actions/upload-artifact@v7
        with:
          name: test-results-phase2-py${{ matrix.python-version }}
          path: reports/test-results-phase2-py${{ matrix.python-version }}.xml
          retention-days: 30

  # Branching policy process-enforced blocking.
  # Do NOT merge a PR to main if this job is red.
  # This job pins the 30-50% token reduction claim from the README.
  # Run locally: make benchmark-headline
  headline-benchmark:
    name: Headline Benchmark (blocking)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python - <<'PY'
          import subprocess
          import sys
          import tomllib

          extras = tomllib.load(open("pyproject.toml", "rb"))["tool"]["tokenpak"]["install-shape-matrix"]["dev"]["product_extras"]
          target = "." + ("[" + ",".join(extras) + "]" if extras else "")
          subprocess.check_call([sys.executable, "-m", "pip", "install", "-e", target])
          PY

      - name: Run headline benchmark
        run: |
          python -m pytest tests/benchmarks/test_headline_claim.py -v -s
